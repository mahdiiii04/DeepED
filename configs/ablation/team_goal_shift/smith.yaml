seed: 0
experiment_name: AblationTeamGoal
env_type: gridworld
algo_name: deep_ed
sub_exp: ${env.scenario_name}/${algo_name}

env:
  scenario_name: team_goal_shift
  num_envs: null
  max_steps: 100
  device: null
  kwargs:
    grid_size: 5
    phase_length: 4000        # collector env steps (100 per iteration) -> 40 iterations per phase
    phase_order: random       # "cyclic" | "random"
    phase_seed: ${seed}       # same schedule for every algorithm at a given seed

model:
  shared_params: False
  centralized_critic: True
  depth: 2
  num_cells: 64

collector:
  frames_per_batch: 51200
  n_iters: 400
  total_frames: null

buffer:
  memory_size: null

train:
  num_epochs: 20
  minibatch_size: 4096
  actor_lr: 1e-4
  critic_lr: 1e-3
  max_grad_norm: 40.0
  device: null
  tau: 0.005

loss:
  entropy_eps: 0.01
  alpha: 0.1
  gamma: 0.95
  dynamics: smith
  safe_step: false

eval:
  enabled: false
  frequency: 10
  qnet_temperature: 0.0       # QMIX: greedy policy for exact NashConv (softmax(Q/T) if > 0)

hydra:
  run:
    dir: .
  output_subdir: null
