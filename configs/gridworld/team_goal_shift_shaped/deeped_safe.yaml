seed: 0
experiment_name: AblationTeamGoalShaped
env_type: gridworld
algo_name: deep_ed_safe
sub_exp: ${env.scenario_name}/${algo_name}

env:
  scenario_name: team_goal_shift
  num_envs: null
  max_steps: 100
  device: null
  kwargs:
    grid_size: 5
    agent_goal_reward: 0.1    # shaped variant
    phase_length: 20000       # collector steps (100 per iteration) -> 200 iterations per phase
    phase_order: random
    phase_seed: ${seed}

model:
  shared_params: False
  centralized_critic: True
  depth: 2
  num_cells: 64

collector:
  frames_per_batch: 51200
  n_iters: 1000
  total_frames: null

buffer:
  memory_size: null

train:
  num_epochs: 20
  minibatch_size: 4096
  actor_lr: 1e-4
  critic_lr: 1e-3
  max_grad_norm: 40.0
  device: null
  tau: 0.005

loss:
  entropy_eps: 0.01
  alpha: 0.1
  gamma: 0.95
  dynamics: smith
  safe_step: true             # per-state step min(alpha, 1/((M-1)*range(Q))): the clamp never acts

eval:
  enabled: false
  frequency: 10
  qnet_temperature: 0.0

hydra:
  run:
    dir: .
  output_subdir: null