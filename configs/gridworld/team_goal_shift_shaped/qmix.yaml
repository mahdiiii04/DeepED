seed: 0
experiment_name: TeamGoalShiftShaped
env_type: gridworld
algo_name: qmix
policy_type: qnet
sub_exp: ${env.scenario_name}/${algo_name}

env:
  scenario_name: team_goal_shift
  num_envs: null
  max_steps: 100
  device: null
  kwargs:
    grid_size: 5
    agent_goal_reward: 0.1    # per-agent goal bonus (shared reward): old convention becomes exploitable
    phase_length: 20000        # collector env steps (100 per iteration) -> 200 iterations per phase
    phase_order: random       # "cyclic" | "random"
    phase_seed: ${seed}       # same schedule for every algorithm at a given seed

model:
  shared_params: False
  depth: 2
  num_cells: 64

collector:
  frames_per_batch: 51200
  n_iters: 1000
  total_frames: null

buffer:
  memory_size: null

train:
  num_epochs: 10
  minibatch_size: 4096
  lr: 1e-3
  max_grad_norm: 40.0
  device: null

loss:
  gamma: 0.95
  tau: 0.005
  eps_init: 0.3
  eps_end: 0.01
  eps_anneal_frac: 0.5
  mixer_type: qmix

eval:
  enabled: false
  frequency: 10
  qnet_temperature: 0.0       # QMIX: greedy policy for exact NashConv (softmax(Q/T) if > 0)

hydra:
  run:
    dir: .
  output_subdir: null
